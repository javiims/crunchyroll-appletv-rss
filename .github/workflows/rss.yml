name: Apple TV RSS Tracker

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      debug_html:
        description: "Save downloaded Apple TV pages as an artifact"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apple-tv-rss-tracker
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Apple TV tracker
        env:
          PYTHONUNBUFFERED: "1"
          DEBUG_HTML_DIR: ${{ inputs.debug_html && 'debug_html' || '' }}
        run: python scraper.py

      - name: Upload downloaded pages (debug)
        if: ${{ always() && inputs.debug_html }}
        uses: actions/upload-artifact@v4
        with:
          name: apple-tv-debug-html
          path: debug_html/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit RSS and links changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.xml links.txt
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Apple TV RSS feed"
            git pull --rebase --autostash
            git push
          fi
